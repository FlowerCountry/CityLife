# CityLife 语言文件 - 简体中文
# 版本: 1.0

# 营养状态警告（等级1-4）
[nutrition.warning.hunger]
level1=你感到肚子有点空空的。
level2=你的胃在咕咕叫，急需进食。
level3=你感到头晕目眩，饥饿难耐。
level4=你的身体在颤抖，快要支撑不住了...

[nutrition.warning.thirst]
level1=你的嘴唇有些干燥。
level2=你感到口渴难耐。
level3=你的喉咙干涩，急需水分。
level4=你感到全身脱水，意识模糊...

[nutrition.warning.protein]
level1=你感到有些乏力。
level2=你的肌肉开始酸痛。
level3=你的四肢沉重，每一步都很艰难。
level4=你的身体在发出警报，肌肉在流失...

[nutrition.warning.carbs]
level1=你感到有点疲倦。
level2=你感到四肢无力。
level3=你的大脑一片混沌，无法集中注意力。
level4=你感到天旋地转，随时可能倒下...

[nutrition.warning.happiness]
level1=你感到有些闷闷不乐。
level2=一种空虚感笼罩着你。
level3=你感到深深的沮丧和无望。
level4=你觉得生活失去了意义...

[nutrition.warning.energy]
level1=你感到有些昏昏欲睡。
level2=你打了个哈欠，精神不济。
level3=你的眼皮越来越沉重。
level4=你几乎睁不开眼，意识在模糊...

[nutrition.warning.vitaminc]
level1=你的牙龈有些敏感。
level2=你感到容易疲劳，伤口愈合变慢。

[nutrition.warning.iron]
level1=你有时会感到头晕。
level2=你的脸色有些苍白。

[nutrition.warning.calcium]
level1=你的骨头偶尔会咔咔作响。
level2=你的肌肉有时会抽筋。

# 营养补充后的感受
[nutrition.feedback.hunger]
high=你感到很饱足。
medium=你不再感到饥饿。
low=你的肚子不那么空了。
minimal=你稍微垫了垫肚子。

[nutrition.feedback.thirst]
high=你感到神清气爽。
medium=你不再感到口渴。
low=你的喉咙湿润了些。
minimal=你润了润嘴唇。

[nutrition.feedback.protein]
high=你感到精力充沛。
medium=你感到有些力气恢复了。
low=你补充了些能量。

[nutrition.feedback.carbs]
high=你感到活力满满。
medium=你不再那么疲惫。
low=你补充了些体力。

[nutrition.feedback.happiness]
high=一股幸福感涌上心头。
medium=你的心情好了些。
low=你感到一丝慰藉。

[nutrition.feedback.energy]
high=你感到精神焕发。
medium=你不再那么困倦。
low=你稍微提了提神。

[nutrition.feedback.vitamin]
high=你感到身体更健康了。
low=你补充了维生素。

[nutrition.feedback.mineral]
high=你感到身体更强壮了。
low=你补充了矿物质。

[nutrition.feedback.sugar]
high=甜蜜的感觉让你开心。
low=你尝到了些甜味。

[nutrition.feedback.fiber]
high=你感到肠胃舒适了。
low=你补充了些纤维。

[nutrition.feedback.probiotic]
high=你感到肠道更健康了。
low=你补充了益生菌。

[nutrition.feedback.default]
msg=你补充了营养。

# 钱包查看相关提示
[wallet.empty]
msg1=钱包空空的，一打开只剩下风吹过。
msg2=口袋拍了拍，只剩点空气作伴。
msg3=翻遍钱包，结果只有比心还干净的底。

[wallet.summary_lead]
msg1=随手一翻，看到这些钞票：
msg2=掀开钱包盖，里面排着：
msg3=哗啦啦翻看钱包，里面静静躺着：

[wallet.has_more]
msg1=剩下的零票得仔细点点才放心。
msg2=还有一些散票，想看的话不妨数一遍。

[wallet.close]
msg1=好吧，先把这些钞票塞回去。
msg2=收好钱包，别让风再偷走什么。
msg3=合上钱包，留着以后慢慢花。

[wallet.detail_lead]
msg1=仔细点点，所有面额如下：
msg2=认真清点一遍，钱包里其实是这样：

[wallet.detail_end]
msg1=点好啦，按回车把它们收回去。
msg2=数得清清楚楚，回车收好钱包。

[wallet.denomination]
d100=鲜红的
d50=紫色的
d20=翠绿的
d10=蓝灰的
d5=褐色的
d1=浅绿色的

[wallet.misc]
no_bills=钱包里现在一张纸币都没有。

